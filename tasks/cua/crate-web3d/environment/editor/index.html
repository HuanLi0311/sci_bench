<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Web3D editor — crate</title>
<style>
  html, body { margin: 0; height: 100%; font: 13px/1.4 "Noto Sans CJK SC", sans-serif;
               background: #16181b; color: #ddd; }
  #layout { display: flex; height: 100%; }
  #viewport { flex: 0 0 auto; }
  #side { width: 380px; padding: 10px; box-sizing: border-box; overflow: auto;
          background: #202327; border-left: 1px solid #333; }
  h3 { margin: 14px 0 6px; font-size: 12px; letter-spacing: .08em; color: #8fb; }
  .row { padding: 3px 6px; cursor: pointer; border-radius: 3px; }
  .row:hover { background: #2d3238; }
  .row.sel { background: #1F6F5C; color: #fff; }
  .grid { display: grid; grid-template-columns: 34px 1fr 34px 1fr 34px 1fr; gap: 4px; }
  .grid input { width: 100%; box-sizing: border-box; background: #121417; color: #eee;
                border: 1px solid #3a3f45; padding: 3px; }
  label { color: #8a9099; font-size: 11px; }
  button { background: #2f353b; color: #e8e8e8; border: 1px solid #444a51;
           padding: 6px 10px; border-radius: 4px; cursor: pointer; margin: 3px 3px 3px 0; }
  button:hover { background: #3a4148; }
  #status { margin-top: 8px; color: #9aa; font-size: 12px; }
  #dims { color: #9cc; font-size: 12px; }
</style>
</head>
<body>
<div id="layout">
  <div id="viewport"></div>
  <div id="side">
    <h3>OBJECTS</h3>
    <div id="outliner"></div>
    <button id="addBox">+ box</button>
    <button id="del">delete</button>

    <div id="props" style="display:none">
      <h3>NAME</h3>
      <input id="nameField" style="width:100%;background:#121417;color:#eee;border:1px solid #3a3f45;padding:3px">
      <div id="dims" style="margin-top:6px"></div>
      <h3>POSITION (mm)</h3>
      <div class="grid">
        <label>x</label><input id="px"><label>y</label><input id="py"><label>z</label><input id="pz">
      </div>
      <h3>SIZE (mm)</h3>
      <div class="grid">
        <label>x</label><input id="sx"><label>y</label><input id="sy"><label>z</label><input id="sz">
      </div>
      <h3>ROTATION (deg)</h3>
      <div class="grid">
        <label>x</label><input id="rx"><label>y</label><input id="ry"><label>z</label><input id="rz">
      </div>
      <button id="apply">apply</button>
    </div>

    <h3>EXPORT</h3>
    <button id="export">export scene.glb</button>
    <div id="status"></div>
  </div>
</div>
<script type="module" src="/app.js"></script>
</body>
</html>
