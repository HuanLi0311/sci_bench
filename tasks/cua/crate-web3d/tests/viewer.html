<!doctype html>
<html>
<head><meta charset="utf-8"><style>html,body{margin:0;background:#fff}canvas{display:block}</style></head>
<body>
<script type="module">
import * as THREE from '/vendor/three.module.js';
import { GLTFLoader } from '/vendor/GLTFLoader.js';

const q = new URLSearchParams(location.search);
const W = +(q.get('w') || 800);
const H = +(q.get('h') || 600);
const sceneUrl = q.get('scene');
const cameraName = q.get('camera') || '';
const rotateSpec = q.get('rotate') || '';

const renderer = new THREE.WebGLRenderer({ antialias: false, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.setSize(W, H);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.NoToneMapping;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xffffff);
scene.add(new THREE.HemisphereLight(0xffffff, 0x666666, 1.1));
const key = new THREE.DirectionalLight(0xffffff, 2.2);
key.position.set(2, -2, 4);
key.castShadow = true;
key.shadow.mapSize.set(1024, 1024);
scene.add(key);
const fill = new THREE.DirectionalLight(0xffffff, 0.7);
fill.position.set(-3, 1, 2);
scene.add(fill);

new GLTFLoader().load(sceneUrl, (gltf) => {
  scene.add(gltf.scene);
  if (rotateSpec) {
    const [nodeName, deg] = rotateSpec.split(':');
    const node = gltf.scene.getObjectByName(nodeName);
    if (node) node.rotation.x += THREE.MathUtils.degToRad(+deg || 0);
    window.__rotated = !!node;
  }
  let camera = null;
  if (cameraName) {
    const obj = gltf.scene.getObjectByName(cameraName);
    if (obj && obj.isCamera) camera = obj;
  }
  if (!camera) {
    camera = new THREE.PerspectiveCamera(35, W / H, 0.01, 100);
    camera.position.set(2, -2, 1.4);
    camera.lookAt(0, 0, 0.3);
  }
  if (camera.isPerspectiveCamera) {
    camera.aspect = W / H;
    camera.updateProjectionMatrix();
  }
  window.__camera = camera ? camera.name : '';
  renderer.render(scene, camera);
  window.__done = true;
}, undefined, (err) => {
  window.__error = String(err);
  window.__done = true;
});
</script>
</body>
</html>
