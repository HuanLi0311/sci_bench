schema_version = "1.4"
artifacts = ["/app/out"]
[task]
name = "terminal-bench-science/microscope-focus"
description = "Build an offline editable Web3D microscope with real focus motion, two-stage Cartesian thin-lens optics, sample mapping and deterministic state replay."
authors = [{ name = "Huan Li", email = "huanhuanli104@gmail.com" }]
keywords = ["web3d", "computer-use", "optics", "assembly", "verifiable-reward"]
[metadata]
domain = "engineering-sciences"
field = "computer-graphics"
subfield = "optical assembly"
expert_time_estimate_hours = 7.0
[agent]
timeout_sec = 7200.0
[environment]
build_timeout_sec = 1800.0
cpus = 4
memory_mb = 8192
storage_mb = 20480
gpus = 0
network_mode = "no-network"
[verifier]
timeout_sec = 600.0
environment_mode = "separate"
[verifier.environment]
network_mode = "no-network"
