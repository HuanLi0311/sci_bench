<!doctype html><html lang="en"><meta charset="utf-8"><title>Microscope | Optical bench</title>

<style>*{box-sizing:border-box}body{margin:0;color:#182e40;background:#f4f7fa;font:15px system-ui}header{padding:20px 28px;background:#123349;color:white;display:flex;justify-content:space-between}h1{font-size:22px;margin:0}header small{color:#a7c6dc}main{display:grid;grid-template-columns:1.3fr 1fr;gap:18px;padding:18px}section{background:white;border:1px solid #d7e1e9;border-radius:10px;overflow:hidden}#viewport{height:550px}h2{font-size:16px;margin:16px}#image{width:100%;background:#101820}label{display:block;padding:10px 16px}input[type=range]{width:60%;vertical-align:middle}button,select{padding:8px;border:1px solid #bfd0db;background:#eff5f9;border-radius:5px;margin:4px}pre{font:12px monospace;max-height:260px;overflow:auto;padding:14px;background:#eff5f9}.bar{padding:10px}p{padding:0 16px;color:#60778a}</style>
<header><h1>Microscope / optical assembly</h1><small>Finite conjugate · air · millimetres</small></header>
<main><section><h2>Editable assembly & actual lens rays</h2><div id="viewport"></div><p>Drag to orbit · scroll to zoom. Gold: outgoing rays; pink: virtual back extensions.</p></section><section><h2>Computed image plane / observer view</h2><canvas id="image" width="1280" height="720"></canvas><label>Stage travel ±10 mm <input id="focus" type="range" min="-10" max="10" step="0.0001" value="0"></label><label>Eyepiece ±5 mm <input id="eye" type="range" min="-5" max="5" step="0.001" value="0"></label><div class="bar"><select id="preset"><option value="0">A / virtual final image</option><option value="1">B / real final image</option><option value="2">C / real final image</option></select><select id="sample"><option>sample_a.png</option><option>sample_b.png</option></select><button id="save">Save</button><button id="reload">Reload</button><button id="reset">Reset</button><input id="load" type="file" accept=".json"></div><pre id="readout"></pre></section></main><script type="module" src="./app.js"></script></html>
